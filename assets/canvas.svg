<?xml version="1.0" encoding="UTF-8"?>
<!-- scifig canvas: 1 user unit = 1 mm. Nature double-column (183 mm). Change width AND the
     viewBox width together to retarget, so the 1:1 mapping survives. Type: 7 pt = 2.47 units,
     8 pt = 2.82. Strokes: 1 pt = 0.35 units, 0.75 pt = 0.26. -->
<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="90mm" viewBox="0 0 183 90"
     font-family="Arial, Helvetica, sans-serif" fill="#4D4D4D">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="4" markerHeight="4"
            refX="3.6" refY="1.5" orient="auto">
      <path d="M0,0 L4,1.5 L0,3 z" fill="#4D4D4D"/>
    </marker>
    <marker id="inhibit" markerUnits="userSpaceOnUse" markerWidth="4" markerHeight="4"
            refX="1" refY="2" orient="auto">
      <path d="M1,0 L1,4" stroke="#4D4D4D" stroke-width="0.35" fill="none"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="183" height="90" fill="#FFFFFF"/>

  <!-- panel letter: 8 pt bold -->
  <text x="3" y="7" font-size="2.82" font-weight="bold">A</text>

  <!-- entity 1 -->
  <circle cx="35" cy="45" r="14" fill="#0072B2"/>
  <text x="35" y="66" font-size="2.47" text-anchor="middle">Entity one</text>

  <!-- entity 2 -->
  <rect x="78" y="33" width="28" height="24" rx="2" fill="#E69F00"/>
  <text x="92" y="66" font-size="2.47" text-anchor="middle">Entity two</text>

  <!-- entity 3 -->
  <circle cx="148" cy="45" r="14" fill="none" stroke="#0072B2" stroke-width="0.35"
          stroke-dasharray="1.5 1.2"/>
  <text x="148" y="66" font-size="2.47" text-anchor="middle">Entity three</text>

  <!-- activation: solid line, filled head -->
  <line x1="51" y1="45" x2="74" y2="45" stroke="#4D4D4D" stroke-width="0.35"
        marker-end="url(#arrow)"/>
  <text x="62" y="41" font-size="2.47" text-anchor="middle">binds</text>

  <!-- translocation: dashed line, filled head -->
  <line x1="108" y1="45" x2="130" y2="45" stroke="#4D4D4D" stroke-width="0.35"
        stroke-dasharray="1.5 1.2" marker-end="url(#arrow)"/>
  <text x="119" y="41" font-size="2.47" text-anchor="middle">translocates</text>
</svg>
